server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Versioned API: pass through unchanged (/api/v1/... -> backend /api/v1/...).
    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # RAG answers can take several seconds
        client_max_body_size 25m;  # PDF uploads
    }

    # Legacy endpoints (health, stats/dashboard, ...): strip the /api prefix
    # exactly like the Vite dev proxy does.
    location ~ ^/api/(?!v1/)(?<legacy>.+)$ {
        proxy_pass http://backend:8000/$legacy$is_args$args;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
