version: "3.9"

services:
  api:
    build: .
    container_name: finquery-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./vectorstore:/app/vectorstore
      - ./data:/app/data
      - ./sample_docs:/app/sample_docs

  ui:
    build: .
    container_name: finquery-ui
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      FINQUERY_API_URL: http://api:8000
    depends_on:
      - api
