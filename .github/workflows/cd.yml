name: CD — Publish images

# Builds and pushes both images to Docker Hub whenever main moves.
# Required repo secrets:
#   DOCKERHUB_USERNAME  -> aniket691
#   DOCKERHUB_TOKEN     -> Docker Hub access token
# Deploy target pulls these tags; see DEPLOY.md.

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/finquery-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/finquery-backend:latest

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/finquery-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/finquery-frontend:latest
